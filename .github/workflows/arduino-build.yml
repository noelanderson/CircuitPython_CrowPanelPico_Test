name: Arduino UF2 Build

on:
  push:
    branches: [main]
    paths:
      - "arduino/CrowPanelPico_Arduino/**"
      - ".github/workflows/arduino-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "arduino/CrowPanelPico_Arduino/**"
      - ".github/workflows/arduino-build.yml"
  workflow_dispatch: {}

env:
  SKETCH_DIR: arduino/CrowPanelPico_Arduino
  FQBN: rp2040:rp2040:rpipico
  RP2040_INDEX_URL: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debug
            touch_debug: 1
          - variant: release
            touch_debug: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino core and libraries
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.FQBN }}-${{ hashFiles('.github/workflows/arduino-build.yml') }}

      - name: Configure board manager URL
        run: arduino-cli config init --overwrite --additional-urls "${{ env.RP2040_INDEX_URL }}"

      - name: Update core index
        run: arduino-cli core update-index

      - name: Install RP2040 board core (earlephilhower/arduino-pico)
        run: arduino-cli core install rp2040:rp2040

      - name: Install required libraries
        run: |
          arduino-cli lib install "PicoDVI - Adafruit Fork"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Regenerate Images.h from buttons.png
        run: python3 "${{ env.SKETCH_DIR }}/tools/convert_images.py"

      - name: Fail if Images.h is out of date
        run: git diff --exit-code -- "${{ env.SKETCH_DIR }}/Images.h"

      - name: Compile sketch (${{ matrix.variant }})
        run: |
          arduino-cli compile \
            --fqbn "${{ env.FQBN }}" \
            --build-property "compiler.cpp.extra_flags=-DCROWPANEL_TOUCH_DEBUG=${{ matrix.touch_debug }}" \
            --output-dir build \
            --warnings all \
            "${{ env.SKETCH_DIR }}"

      - name: Locate UF2 output
        run: |
          UF2_FILE=$(find build -maxdepth 1 -name '*.uf2' | head -n1)
          if [ -z "$UF2_FILE" ]; then
            echo "No .uf2 file found in build output" >&2
            find build -maxdepth 1 -type f >&2
            exit 1
          fi
          echo "Found UF2: $UF2_FILE"
          cp "$UF2_FILE" "build/CrowPanelPico_Arduino-${{ matrix.variant }}.uf2"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v6
        with:
          name: CrowPanelPico_Arduino-${{ matrix.variant }}-uf2
          path: build/CrowPanelPico_Arduino-${{ matrix.variant }}.uf2
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download UF2 artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: CrowPanelPico_Arduino-*-uf2
          path: build
          merge-multiple: true

      - name: Attach UF2s to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.uf2
